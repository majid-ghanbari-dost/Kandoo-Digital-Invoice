name: Python tests

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: Ubuntu / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest Pillow 'jsonschema>=4.18,<5'

      # The Glyph-only path and the adapter's no-Tesseract regression test run
      # without a system OCR executable. Do not add Tesseract to this job.
      - name: Run the existing Python test suite
        run: python -m pytest -q
        env:
          PYTHONPATH: src
