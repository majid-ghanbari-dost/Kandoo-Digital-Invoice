name: Windows one-folder build

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  n04-parisaocr-windows:
    name: N-04 optional ParisaOCR CPU measurements / Windows-latest
    # Run the heavyweight optional stack only for N-04 task commits. The normal
    # Windows CLI job below remains OCR-free and does not acquire these dependencies.
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'N-04:') }}
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: src;scripts
      PYTHONDONTWRITEBYTECODE: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create isolated OCR venv and measure baseline
        shell: pwsh
        run: |
          $venv = Join-Path $env:RUNNER_TEMP 'n04-parisaocr-venv'
          python -m venv $venv
          $n04Python = Join-Path $venv 'Scripts/python.exe'
          & $n04Python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $baseline = Join-Path $env:RUNNER_TEMP 'n04-site-packages-before.json'
          & $n04Python scripts/benchmark_n04_parisaocr.py --snapshot-site-packages $baseline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "N04_PYTHON=$n04Python" >> $env:GITHUB_ENV
          "N04_INSTALL_BASELINE=$baseline" >> $env:GITHUB_ENV

      - name: Install pinned optional ParisaOCR and Kraken runtime
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'n04-pip-install-report.json'
          $started = Get-Date
          & $env:N04_PYTHON -m pip install --report $report -r scripts/n04-parisaocr-requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $elapsed = ((Get-Date) - $started).TotalSeconds
          Write-Output ("N04_PIP_INSTALL_SECONDS={0:N3}" -f $elapsed)

      - name: Run N-04 Windows CPU benchmark and suggestion pass
        shell: pwsh
        run: |
          $json = Join-Path $env:RUNNER_TEMP 'n04-name-suggestions.json'
          $markdown = Join-Path $env:RUNNER_TEMP 'n04-name-suggestions.md'
          & $env:N04_PYTHON scripts/benchmark_n04_parisaocr.py `
            --repo-root . `
            --install-baseline $env:N04_INSTALL_BASELINE `
            --output-json $json `
            --output-markdown $markdown
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload raw N-04 Windows metrics and resolved dependency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n04-name-suggestions-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/n04-name-suggestions.json
            ${{ runner.temp }}/n04-name-suggestions.md
            ${{ runner.temp }}/n04-site-packages-before.json
            ${{ runner.temp }}/n04-pip-install-report.json
          if-no-files-found: warn
          retention-days: 14

  windows-build:
    name: Windows / Python 3.11 / PyInstaller onedir
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: src
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test and packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest Pillow 'jsonschema>=4.18,<5' 'pyinstaller==6.22.3'

      # Golden JSON hashes are over exact UTF-8/LF bytes. Restore the frozen
      # contract files from Git without Windows autocrlf conversion.
      - name: Preserve frozen contract bytes
        shell: pwsh
        run: |
          git config --local core.autocrlf false
          git checkout -- contracts

      # The full cross-repository suite runs on Ubuntu in python-tests.yml.
      # Windows validates the product/package path and its contract boundaries;
      # the unrelated full suite exceeded GitHub's 45-minute Windows job limit.
      - name: Windows tests - pipeline v0
        run: python -m pytest -q tests/test_pipeline_v0.py

      - name: Windows tests - extraction adapter
        run: python -m pytest -q src/image_extraction_adapter/tests

      - name: Windows tests - E-05 template bank
        run: python -m pytest -q src/e05_template_bank/tests

      - name: Windows tests - E-06 verdict
        run: python -m pytest -q src/e06_onboarding_verdict/tests

      - name: Windows tests - frozen E-11 contract package
        run: python -m pytest -q tests/test_e11_contract_package.py

      # Deliberately do not install Tesseract or tesserocr. The CLI product
      # path uses the local Glyph classifier only.
      - name: Build the Windows one-folder CLI
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm --onedir --console `
            --name kandoo-extract `
            --distpath dist `
            --workpath "$env:RUNNER_TEMP/pyinstaller-work" `
            --specpath "$env:RUNNER_TEMP/pyinstaller-spec" `
            --paths src `
            --hidden-import run_name_cluster_experiment `
            scripts/windows_cli_entry.py
          New-Item -ItemType Directory -Force -Path dist/kandoo-extract/src | Out-Null
          New-Item -ItemType Directory -Force -Path dist/kandoo-extract/schemas | Out-Null
          Copy-Item src/templates_bank_default.json dist/kandoo-extract/src/templates_bank_default.json -Force
          Copy-Item schemas/canonical_invoice_v0.json dist/kandoo-extract/schemas/canonical_invoice_v0.json -Force
          if (-not (Test-Path dist/kandoo-extract/kandoo-extract.exe)) {
            throw 'PyInstaller did not produce dist/kandoo-extract/kandoo-extract.exe'
          }

      - name: Verify frozen CLI, E-01 fixture values, and E-11 contract crosswalk
        shell: pwsh
        run: |
          python scripts/verify_windows_bundle.py `
            --exe dist/kandoo-extract/kandoo-extract.exe `
            --report-json "$env:RUNNER_TEMP/windows-build-evidence.json" `
            --report-md "$env:RUNNER_TEMP/windows-build-evidence.md"

      - name: Upload the one-folder build and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-onefolder-${{ github.run_id }}
          path: |
            dist/kandoo-extract
            ${{ runner.temp }}/windows-build-evidence.json
            ${{ runner.temp }}/windows-build-evidence.md
          if-no-files-found: warn
          retention-days: 14
